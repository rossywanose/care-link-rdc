<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Care-Link RDC - Plateforme de gestion des certificats de naissance et de décès en République Démocratique du Congo" />

    <title>Care-Link RDC | Gestion des Certificats</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg">

    <!-- PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-192x192.png" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #0f172a;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Animated Background */
      .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: 
          radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
          radial-gradient(ellipse at 50% 50%, rgba(15, 23, 42, 0.5) 0%, transparent 60%);
        animation: bgPulse 10s ease-in-out infinite;
      }

      @keyframes bgPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.03); }
      }

      /* Floating Particles */
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }

      .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        background: rgba(99, 102, 241, 0.4);
        border-radius: 50%;
        animation: float 20s infinite;
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(100vh) rotate(0deg);
          opacity: 0;
        }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% {
          transform: translateY(-100vh) rotate(720deg);
          opacity: 0;
        }
      }

      #root {
        position: relative;
        z-index: 10;
        min-height: 100vh;
      }

      /* ========== LOADING SCREEN ========== */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }

      .loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Logo Container */
      .logo-container {
        position: relative;
        width: 140px;
        height: 140px;
        margin-bottom: 2rem;
      }

      /* Indigo Glow */
      .logo-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 180px;
        height: 180px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
        border-radius: 50%;
        animation: glowPulse 2.5s ease-in-out infinite;
      }

      @keyframes glowPulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
        50% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.7; }
      }

      /* SVG Logo Animation */
      .logo-svg {
        width: 100%;
        height: 100%;
        animation: logoFloat 3s ease-in-out infinite;
        filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.3));
      }

      @keyframes logoFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      /* Ring Animation */
      .logo-ring {
        animation: ringSpin 8s linear infinite;
        transform-origin: center;
      }

      @keyframes ringSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Brand Name */
      .brand-name {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 2.8rem;
        font-weight: 700;
        letter-spacing: 3px;
        margin-bottom: 0.5rem;
        opacity: 0;
        animation: fadeInUp 1s ease 0.3s forwards;
      }

      .brand-name .care {
        color: #f8fafc;
      }

      .brand-name .link {
        background: linear-gradient(135deg, #818cf8 0%, #6366f1 50%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .brand-tagline {
        color: #94a3b8;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 3rem;
        opacity: 0;
        animation: fadeInUp 1s ease 0.6s forwards;
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Progress Bar */
      .progress-container {
        width: 280px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
        opacity: 0;
        animation: fadeInUp 1s ease 0.9s forwards;
      }

      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #818cf8, #6366f1, #8b5cf6);
        border-radius: 2px;
        width: 0%;
        animation: loadProgress 2.5s ease-in-out infinite;
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
      }

      @keyframes loadProgress {
        0% { width: 0%; transform: translateX(-100%); }
        50% { width: 100%; transform: translateX(0); }
        100% { width: 100%; transform: translateX(100%); }
      }

      .loading-text {
        color: #475569;
        font-size: 0.8rem;
        margin-top: 1.2rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0;
        animation: fadeInUp 1s ease 1.2s forwards;
      }

      .loading-dots::after {
        content: '';
        animation: dots 1.5s steps(4, end) infinite;
      }

      @keyframes dots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
        100% { content: ''; }
      }

      /* Decorative Elements */
      .corner-decoration {
        position: fixed;
        width: 350px;
        height: 350px;
        border: 1px solid rgba(99, 102, 241, 0.08);
        border-radius: 50%;
        pointer-events: none;
      }

      .corner-decoration.top-left {
        top: -175px;
        left: -175px;
        animation: rotate 25s linear infinite;
      }

      .corner-decoration.bottom-right {
        bottom: -175px;
        right: -175px;
        animation: rotate 25s linear infinite reverse;
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Grid Pattern */
      .grid-pattern {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          linear-gradient(rgba(99, 102, 241, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(99, 102, 241, 0.02) 1px, transparent 1px);
        background-size: 60px 60px;
        z-index: 0;
        pointer-events: none;
      }

      /* Responsive */
      @media (max-width: 640px) {
        .logo-container { width: 110px; height: 110px; }
        .logo-glow { width: 140px; height: 140px; }
        .brand-name { font-size: 2rem; letter-spacing: 2px; }
        .brand-tagline { font-size: 0.8rem; }
        .progress-container { width: 220px; }
        .corner-decoration { width: 200px; height: 200px; }
        .corner-decoration.top-left { top: -100px; left: -100px; }
        .corner-decoration.bottom-right { bottom: -100px; right: -100px; }
      }

      /* Light mode */
      @media (prefers-color-scheme: light) {
        body { background: #f8fafc; }
        .loading-screen { background: #f8fafc; }
        .brand-name .care { color: #0f172a; }
        .brand-tagline { color: #64748b; }
        .loading-text { color: #94a3b8; }
        .bg-animation {
          background: 
            radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.06) 0%, transparent 50%),
            radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
        }
        .grid-pattern {
          background-image: 
            linear-gradient(rgba(15, 23, 42, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(15, 23, 42, 0.04) 1px, transparent 1px);
        }
        .corner-decoration { border-color: rgba(99, 102, 241, 0.06); }
      }
    </style>
  <base target="_blank">
</head>
  <body>
    <!-- Background -->
    <div class="bg-animation"></div>
    <div class="grid-pattern"></div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Corners -->
    <div class="corner-decoration top-left"></div>
    <div class="corner-decoration bottom-right"></div>

    <!-- ========== LOADING SCREEN ========== -->
    <div class="loading-screen" id="loadingScreen">
      <div class="logo-container">
        <div class="logo-glow"></div>

        <!-- Logo SVG inline - Care-Link RDC -->
        <svg class="logo-svg" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="indigo" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#818cf8"/>
              <stop offset="50%" style="stop-color:#6366f1"/>
              <stop offset="100%" style="stop-color:#8b5cf6"/>
            </linearGradient>
          </defs>

          <!-- Background circle -->
          <circle cx="256" cy="256" r="220" fill="#0f172a" opacity="0.9"/>

          <!-- Animated ring -->
          <g class="logo-ring">
            <circle cx="256" cy="256" r="190" fill="none" stroke="url(#indigo)" stroke-width="2" opacity="0.3"/>
            <circle cx="256" cy="256" r="175" fill="none" stroke="url(#indigo)" stroke-width="1" opacity="0.15"/>
          </g>

          <!-- Shield / Medical Cross -->
          <path d="M256 110 L370 175 L370 290 C370 360 320 395 256 415 C192 395 142 360 142 290 L142 175 Z" 
                fill="none" stroke="url(#indigo)" stroke-width="3" stroke-linejoin="round" opacity="0.5"/>

          <!-- Medical Cross inside shield -->
          <rect x="236" y="200" width="40" height="120" rx="6" fill="url(#indigo)" opacity="0.95"/>
          <rect x="196" y="240" width="120" height="40" rx="6" fill="url(#indigo)" opacity="0.95"/>

          <!-- Heart pulse line -->
          <path d="M170 340 L200 340 L215 310 L240 360 L260 320 L280 350 L300 330 L320 340 L342 340" 
                fill="none" stroke="url(#indigo)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

          <!-- Dots decoration -->
          <circle cx="200" cy="395" r="3" fill="url(#indigo)" opacity="0.6"/>
          <circle cx="256" cy="403" r="4" fill="url(#indigo)" opacity="0.8"/>
          <circle cx="312" cy="395" r="3" fill="url(#indigo)" opacity="0.6"/>
        </svg>
      </div>

      <h1 class="brand-name">
        <span class="care">Care</span><span class="link">-Link-</span><span class="care">RDC</span>
      </h1>
      <p class="brand-tagline">Registre Sanitaire de Kinshasa</p>

      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>

      <p class="loading-text">
        Chargement<span class="loading-dots"></span>
      </p>
    </div>

    <!-- React Root -->
    <div id="root"></div>

    <!-- NoScript -->
    <noscript>
      <div style="
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #0f172a; display: flex; align-items: center; justify-content: center;
        flex-direction: column; color: white; font-family: 'Inter', sans-serif;
        text-align: center; padding: 2rem;
      ">
        <div style="font-size: 4rem; margin-bottom: 1rem;">⚠️</div>
        <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: #818cf8;">
          JavaScript requis
        </h1>
        <p style="color: #94a3b8; max-width: 400px;">
          Care-Link RDC nécessite JavaScript pour fonctionner. Veuillez l'activer dans votre navigateur.
        </p>
      </div>
    </noscript>

    <script>
      // Particles
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 20 + 's';
        p.style.animationDuration = (15 + Math.random() * 12) + 's';
        p.style.opacity = Math.random() * 0.5 + 0.2;
        const s = Math.random() * 3 + 2;
        p.style.width = s + 'px';
        p.style.height = s + 'px';
        particlesContainer.appendChild(p);
      }

      // Hide loading screen
      window.addEventListener('load', () => {
        setTimeout(() => {
          const ls = document.getElementById('loadingScreen');
          if (ls) {
            ls.classList.add('hidden');
            setTimeout(() => { ls.style.display = 'none'; }, 800);
          }
        }, 2500);
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="SchoolPay - Système de gestion des paiements scolaires" />
    
    <title>SchoolPay | Gestion des Frais Scolaires</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html {
        scroll-behavior: smooth;
      }
      
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #020617;
        min-height: 100vh;
        overflow-x: hidden;
        color: #f8fafc;
      }
      
      /* Ultra Dynamic Background */
      .bg-universe {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: 
          radial-gradient(ellipse at 0% 0%, rgba(59, 130, 246, 0.25) 0%, transparent 50%),
          radial-gradient(ellipse at 100% 0%, rgba(168, 85, 247, 0.2) 0%, transparent 50%),
          radial-gradient(ellipse at 100% 100%, rgba(34, 197, 94, 0.2) 0%, transparent 50%),
          radial-gradient(ellipse at 0% 100%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
          radial-gradient(ellipse at 50% 50%, rgba(6, 182, 212, 0.1) 0%, transparent 60%),
          #020617;
        animation: universeShift 12s ease-in-out infinite;
      }
      
      @keyframes universeShift {
        0%, 100% { 
          filter: hue-rotate(0deg) saturate(1);
          transform: scale(1);
        }
        25% { 
          filter: hue-rotate(15deg) saturate(1.2);
          transform: scale(1.02);
        }
        50% { 
          filter: hue-rotate(-10deg) saturate(0.9);
          transform: scale(1.01);
        }
        75% { 
          filter: hue-rotate(5deg) saturate(1.1);
          transform: scale(1.03);
        }
      }
      
      /* Animated Mesh Gradient */
      .mesh-gradient {
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        z-index: 1;
        background: 
          radial-gradient(at 40% 20%, hsla(217,91%,60%,0.3) 0px, transparent 50%),
          radial-gradient(at 80% 0%, hsla(271,70%,50%,0.25) 0px, transparent 50%),
          radial-gradient(at 0% 50%, hsla(158,80%,45%,0.2) 0px, transparent 50%),
          radial-gradient(at 80% 50%, hsla(340,75%,55%,0.2) 0px, transparent 50%),
          radial-gradient(at 0% 100%, hsla(199,89%,48%,0.25) 0px, transparent 50%),
          radial-gradient(at 80% 100%, hsla(242,70%,50%,0.2) 0px, transparent 50%);
        animation: meshMove 20s ease-in-out infinite;
        pointer-events: none;
      }
      
      @keyframes meshMove {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(2%, 2%) rotate(2deg); }
        66% { transform: translate(-1%, 3%) rotate(-1deg); }
      }
      
      /* Noise Texture Overlay */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        opacity: 0.03;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
      
      /* Floating Particles System */
      .particles-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
        overflow: hidden;
      }
      
      .particle {
        position: absolute;
        border-radius: 50%;
        filter: blur(1px);
      }
      
      .particle.orbit {
        animation: orbit 25s linear infinite;
      }
      
      @keyframes orbit {
        from { transform: rotate(0deg) translateX(100px) rotate(0deg); }
        to { transform: rotate(360deg) translateX(100px) rotate(-360deg); }
      }
      
      /* Light Rays */
      .light-rays {
        position: fixed;
        top: -50%;
        left: 50%;
        width: 200vw;
        height: 200vw;
        transform: translateX(-50%);
        z-index: 1;
        background: conic-gradient(
          from 0deg at 50% 50%,
          transparent 0deg,
          rgba(59, 130, 246, 0.03) 20deg,
          transparent 40deg,
          rgba(168, 85, 247, 0.03) 60deg,
          transparent 80deg,
          rgba(34, 197, 94, 0.03) 100deg,
          transparent 120deg,
          rgba(236, 72, 153, 0.03) 140deg,
          transparent 160deg,
          rgba(6, 182, 212, 0.03) 180deg,
          transparent 360deg
        );
        animation: rayRotate 30s linear infinite;
        pointer-events: none;
      }
      
      @keyframes rayRotate {
        from { transform: translateX(-50%) rotate(0deg); }
        to { transform: translateX(-50%) rotate(360deg); }
      }
      
      /* Grid with Perspective */
      .perspective-grid {
        position: fixed;
        bottom: -30%;
        left: -50%;
        width: 200%;
        height: 100%;
        z-index: 2;
        background-image: 
          linear-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px);
        background-size: 60px 60px;
        transform: perspective(500px) rotateX(60deg);
        animation: gridMove 4s linear infinite;
        opacity: 0.3;
        pointer-events: none;
      }
      
      @keyframes gridMove {
        0% { background-position: 0 0; }
        100% { background-position: 0 60px; }
      }
      
      /* Main Container */
      #root {
        position: relative;
        z-index: 10;
        min-height: 100vh;
      }
      
      /* Loading Screen - Premium Edition */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #020617;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.1);
        filter: blur(20px);
      }
      
      .loading-screen.exiting {
        animation: exitReveal 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      
      @keyframes exitReveal {
        0% {
          clip-path: circle(150% at 50% 50%);
          opacity: 1;
        }
        100% {
          clip-path: circle(0% at 50% 50%);
          opacity: 0;
        }
      }
      
      /* 3D Logo Container */
      .logo-stage {
        position: relative;
        width: 200px;
        height: 200px;
        margin-bottom: 2rem;
        transform-style: preserve-3d;
        animation: stageFloat 6s ease-in-out infinite;
      }
      
      @keyframes stageFloat {
        0%, 100% { transform: translateY(0) rotateX(0deg); }
        50% { transform: translateY(-20px) rotateX(5deg); }
      }
      
      /* Multiple Glow Layers */
      .glow-layer {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        filter: blur(40px);
      }
      
      .glow-layer-1 {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.4) 0%, transparent 70%);
        animation: glowPulse1 3s ease-in-out infinite;
      }
      
      .glow-layer-2 {
        width: 250px;
        height: 250px;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, transparent 70%);
        animation: glowPulse2 4s ease-in-out infinite 0.5s;
      }
      
      .glow-layer-3 {
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, rgba(34, 197, 94, 0.25) 0%, transparent 70%);
        animation: glowPulse3 3.5s ease-in-out infinite 1s;
      }
      
      @keyframes glowPulse1 {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
        50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
      }
      
      @keyframes glowPulse2 {
        0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; }
        50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.7; }
      }
      
      @keyframes glowPulse3 {
        0%, 100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.5; }
        50% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; }
      }
      
      /* Logo Ring */
      .logo-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 180px;
        height: 180px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        animation: ringRotate 10s linear infinite;
      }
      
      .logo-ring::before {
        content: '';
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        bottom: 10px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 50%;
        animation: ringRotate 15s linear infinite reverse;
      }
      
      @keyframes ringRotate {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
      
      /* Main Logo Icon */
      .logo-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 5rem;
        z-index: 10;
        filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.6)) 
                drop-shadow(0 0 80px rgba(168, 85, 247, 0.4));
        animation: logoBreath 4s ease-in-out infinite;
      }
      
      @keyframes logoBreath {
        0%, 100% { 
          transform: translate(-50%, -50%) scale(1);
          filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.6)) 
                  drop-shadow(0 0 80px rgba(168, 85, 247, 0.4));
        }
        50% { 
          transform: translate(-50%, -50%) scale(1.15);
          filter: drop-shadow(0 0 60px rgba(59, 130, 246, 0.8)) 
                  drop-shadow(0 0 100px rgba(168, 85, 247, 0.6));
        }
      }
      
      /* Brand Typography */
      .brand-container {
        text-align: center;
        position: relative;
      }
      
      .brand-name {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 4rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        position: relative;
        display: inline-block;
        margin-bottom: 0.5rem;
      }
      
      .brand-name-gradient {
        background: linear-gradient(
          135deg,
          #60a5fa 0%,
          #a78bfa 25%,
          #34d399 50%,
          #f472b6 75%,
          #60a5fa 100%
        );
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradientShift 8s ease infinite;
      }
      
      @keyframes gradientShift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      
      /* Glitch Effect on Hover */
      .brand-name::after {
        content: 'SchoolPay';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #ef4444 0%, #f59e0b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        opacity: 0;
        animation: glitch 3s infinite;
        pointer-events: none;
      }
      
      @keyframes glitch {
        0%, 90%, 100% { opacity: 0; transform: translate(0); }
        92% { opacity: 0.8; transform: translate(-2px, 2px); }
        94% { opacity: 0; transform: translate(0); }
        96% { opacity: 0.8; transform: translate(2px, -2px); }
      }
      
      .brand-tagline {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.875rem;
        font-weight: 500;
        color: #64748b;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 3rem;
        opacity: 0;
        animation: fadeInUp 1s ease 0.3s forwards;
      }
      
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      /* Premium Progress Bar */
      .progress-container {
        width: 320px;
        height: 6px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      }
      
      .progress-track {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.1),
          transparent
        );
        animation: trackShine 2s infinite;
      }
      
      @keyframes trackShine {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      
      .progress-bar {
        height: 100%;
        background: linear-gradient(
          90deg,
          #3b82f6 0%,
          #8b5cf6 25%,
          #22c55e 50%,
          #ec4899 75%,
          #06b6d4 100%
        );
        background-size: 200% 100%;
        border-radius: 3px;
        width: 0%;
        animation: loadProgress 5s cubic-bezier(0.4, 0, 0.2, 1) forwards,
                   shimmer 2s linear infinite;
        box-shadow: 
          0 0 20px rgba(59, 130, 246, 0.5),
          0 0 40px rgba(139, 92, 246, 0.3);
        position: relative;
        overflow: hidden;
      }
      
      .progress-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        animation: progressGlow 1.5s infinite;
      }
      
      @keyframes loadProgress {
        0% { width: 0%; }
        100% { width: 100%; }
      }
      
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      
      @keyframes progressGlow {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      
      /* Percentage Counter */
      .progress-info {
        margin-top: 1.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        font-family: 'JetBrains Mono', monospace;
      }
      
      .progress-percentage {
        font-size: 2rem;
        font-weight: 700;
        color: #60a5fa;
        text-shadow: 0 0 20px rgba(96, 165, 250, 0.5);
        min-width: 60px;
        text-align: right;
      }
      
      .progress-status {
        font-size: 0.875rem;
        color: #94a3b8;
        letter-spacing: 0.1em;
      }
      
      .loading-dots::after {
        content: '';
        animation: dots 1.5s steps(4, end) infinite;
      }
      
      @keyframes dots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
        100% { content: ''; }
      }
      
      /* Decorative Corner Elements */
      .corner-accent {
        position: fixed;
        width: 150px;
        height: 150px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        pointer-events: none;
        z-index: 5;
      }
      
      .corner-accent.top-left {
        top: 40px;
        left: 40px;
        border-right: none;
        border-bottom: none;
      }
      
      .corner-accent.top-right {
        top: 40px;
        right: 40px;
        border-left: none;
        border-bottom: none;
      }
      
      .corner-accent.bottom-left {
        bottom: 40px;
        left: 40px;
        border-right: none;
        border-top: none;
      }
      
      .corner-accent.bottom-right {
        bottom: 40px;
        right: 40px;
        border-left: none;
        border-top: none;
      }
      
      .corner-accent::before {
        content: '';
        position: absolute;
        width: 8px;
        height: 8px;
        background: rgba(59, 130, 246, 0.5);
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
      }
      
      .corner-accent.top-left::before { bottom: -4px; right: -4px; }
      .corner-accent.top-right::before { bottom: -4px; left: -4px; }
      .corner-accent.bottom-left::before { top: -4px; right: -4px; }
      .corner-accent.bottom-right::before { top: -4px; left: -4px; }
      
      /* Floating Orbs */
      .floating-orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.4;
        pointer-events: none;
        z-index: 1;
      }
      
      .orb-1 {
        width: 400px;
        height: 400px;
        background: rgba(59, 130, 246, 0.3);
        top: 10%;
        left: 10%;
        animation: orbFloat1 20s ease-in-out infinite;
      }
      
      .orb-2 {
        width: 300px;
        height: 300px;
        background: rgba(168, 85, 247, 0.25);
        bottom: 20%;
        right: 15%;
        animation: orbFloat2 25s ease-in-out infinite;
      }
      
      .orb-3 {
        width: 250px;
        height: 250px;
        background: rgba(34, 197, 94, 0.2);
        top: 50%;
        left: 70%;
        animation: orbFloat3 18s ease-in-out infinite;
      }
      
      @keyframes orbFloat1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -30px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
      }
      
      @keyframes orbFloat2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-40px, -20px) scale(1.15); }
      }
      
      @keyframes orbFloat3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        25% { transform: translate(20px, 40px) scale(0.95); }
        75% { transform: translate(-30px, -10px) scale(1.05); }
      }
      
      /* Version Badge */
      .version-badge {
        position: fixed;
        bottom: 30px;
        right: 30px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.2);
        letter-spacing: 0.1em;
        z-index: 10;
      }
      
      /* Responsive */
      @media (max-width: 768px) {
        .brand-name {
          font-size: 2.5rem;
        }
        
        .logo-stage {
          width: 150px;
          height: 150px;
        }
        
        .logo-icon {
          font-size: 3.5rem;
        }
        
        .progress-container {
          width: 280px;
        }
        
        .corner-accent {
          width: 80px;
          height: 80px;
        }
        
        .corner-accent.top-left { top: 20px; left: 20px; }
        .corner-accent.top-right { top: 20px; right: 20px; }
        .corner-accent.bottom-left { bottom: 20px; left: 20px; }
        .corner-accent.bottom-right { bottom: 20px; right: 20px; }
        
        .floating-orb {
          opacity: 0.2;
        }
      }
      
      /* Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Premium Background Layers -->
    <div class="bg-universe"></div>
    <div class="mesh-gradient"></div>
    <div class="light-rays"></div>
    <div class="noise-overlay"></div>
    <div class="perspective-grid"></div>
    
    <!-- Floating Orbs -->
    <div class="floating-orb orb-1"></div>
    <div class="floating-orb orb-2"></div>
    <div class="floating-orb orb-3"></div>
    
    <!-- Particles Container -->
    <div class="particles-container" id="particles"></div>
    
    <!-- Corner Accents -->
    <div class="corner-accent top-left"></div>
    <div class="corner-accent top-right"></div>
    <div class="corner-accent bottom-left"></div>
    <div class="corner-accent bottom-right"></div>
    
    <!-- Premium Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
      <div class="logo-stage">
        <div class="glow-layer glow-layer-1"></div>
        <div class="glow-layer glow-layer-2"></div>
        <div class="glow-layer glow-layer-3"></div>
        <div class="logo-ring"></div>
        <div class="logo-icon">🎓</div>
      </div>
      
      <div class="brand-container">
        <h1 class="brand-name">
          <span class="brand-name-gradient">SchoolPay</span>
        </h1>
        <p class="brand-tagline">Système de Gestion des Paiements Scolaires</p>
      </div>
      
      <div class="progress-container">
        <div class="progress-track"></div>
        <div class="progress-bar" id="progressBar"></div>
      </div>
      
      <div class="progress-info">
        <span class="progress-percentage" id="progressPercent">0%</span>
        <span class="progress-status">
          Initialisation<span class="loading-dots"></span>
        </span>
      </div>
    </div>
    
    <!-- React Root -->
    <div id="root"></div>
    
    <!-- Version Badge -->
    <div class="version-badge">v1.0.0 | Saint Vicent</div>
    
    <noscript>
      <div style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #020617;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
        text-align: center;
        padding: 2rem;
        z-index: 99999;
      ">
        <div style="font-size: 4rem; margin-bottom: 1rem; filter: grayscale(1);">⚠️</div>
        <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: #ef4444; font-family: 'Space Grotesk', sans-serif;">
          JavaScript Requis
        </h1>
        <p style="color: #94a3b8; max-width: 400px; line-height: 1.6;">
          SchoolPay nécessite JavaScript pour fonctionner. Veuillez activer JavaScript dans les paramètres de votre navigateur.
        </p>
      </div>
    </noscript>
    
    <script>
      // Generate floating particles with varied behaviors
      const particlesContainer = document.getElementById('particles');
      const particleCount = 50;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        // Random properties
        const size = Math.random() * 6 + 2;
        const x = Math.random() * 100;
        const delay = Math.random() * 20;
        const duration = 15 + Math.random() * 20;
        const opacity = Math.random() * 0.6 + 0.2;
        
        // Random color from palette
        const colors = [
          'rgba(59, 130, 246,',
          'rgba(168, 85, 247,',
          'rgba(34, 197, 94,',
          'rgba(236, 72, 153,',
          'rgba(6, 182, 212,'
        ];
        const color = colors[Math.floor(Math.random() * colors.length)] + opacity + ')';
        
        particle.style.cssText = `
          width: ${size}px;
          height: ${size}px;
          left: ${x}%;
          background: ${color};
          box-shadow: 0 0 ${size * 2}px ${color};
          animation-delay: ${delay}s;
          animation-duration: ${duration}s;
          bottom: -10px;
        `;
        
        particle.style.animation = `float ${duration}s linear infinite`;
        particle.style.animationDelay = `${delay}s`;
        
        particlesContainer.appendChild(particle);
      }
      
      // Add float animation dynamically
      const style = document.createElement('style');
      style.textContent = `
        @keyframes float {
          0% {
            transform: translateY(0) rotate(0deg) scale(1);
            opacity: 0;
          }
          10% {
            opacity: 1;
          }
          90% {
            opacity: 1;
          }
          100% {
            transform: translateY(-110vh) rotate(${360 + Math.random() * 720}deg) scale(0.5);
            opacity: 0;
          }
        }
      `;
      document.head.appendChild(style);
      
      // Progress counter animation (5 seconds)
      const progressPercent = document.getElementById('progressPercent');
      const progressBar = document.getElementById('progressBar');
      const loadingScreen = document.getElementById('loadingScreen');
      let progress = 0;
      const duration = 5000; // 5 seconds
      const interval = 50; // Update every 50ms
      const increment = 100 / (duration / interval);
      
      const updateProgress = setInterval(() => {
        progress += increment;
        
        if (progress >= 100) {
          progress = 100;
          clearInterval(updateProgress);
          
          // Small delay at 100% before hiding
          setTimeout(() => {
            loadingScreen.classList.add('exiting');
            setTimeout(() => {
              loadingScreen.style.display = 'none';
            }, 800);
          }, 300);
        }
        
        progressPercent.textContent = Math.floor(progress) + '%';
        
        // Update status text based on progress
        const statusEl = document.querySelector('.progress-status');
        if (progress < 20) {
          statusEl.innerHTML = 'Initialisation<span class="loading-dots"></span>';
        } else if (progress < 40) {
          statusEl.innerHTML = 'Chargement des modules<span class="loading-dots"></span>';
        } else if (progress < 60) {
          statusEl.innerHTML = 'Connexion sécurisée<span class="loading-dots"></span>';
        } else if (progress < 80) {
          statusEl.innerHTML = 'Préparation de l\'interface<span class="loading-dots"></span>';
        } else if (progress < 100) {
          statusEl.innerHTML = 'Finalisation<span class="loading-dots"></span>';
        } else {
          statusEl.textContent = 'Prêt !';
          statusEl.style.color = '#22c55e';
        }
      }, interval);
      
      // Ensure minimum display time even if React loads faster
      window.addEventListener('load', () => {
        // The animation will complete naturally in 5s
        // This just ensures React is mounted when we hide
      });
    </script>
  </body>
</html>
